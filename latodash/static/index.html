<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LatoDash</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main">
      <a class="brand" href="#overview" title="LatoDash">
        <img src="favicon.svg" alt="" width="34" height="34">
        <span class="brand-name">Lato<b>Dash</b></span>
      </a>
      <nav class="nav" role="tablist">
        <a href="#overview" data-view="overview" role="tab"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Overview</span></a>
        <a href="#logs" data-view="logs" role="tab"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg><span>Logs</span><i class="nav-badge" id="badge-logs" hidden></i></a>
        <a href="#api" data-view="api" role="tab"><svg viewBox="0 0 24 24"><path d="M7 7h3v2H7v6h3v2H5V7zm10 0h2v10h-5v-2h3V9h-3V7zm-6 4h2v2h-2z"/></svg><span>API calls</span></a>
        <a href="#settings" data-view="settings" role="tab"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2zM3 5v2h10V5zm10 16v-2h8v-2h-8v-2h-2v6zM7 9v2H3v2h4v2h2V9zm14 4v-2H11v2zm-6-4h2V7h4V5h-4V3h-2z"/></svg><span>Settings</span></a>
        <a href="#gifs" data-view="gifs" role="tab"><svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m-9 9.5H8.5v-3H10V9H7v6h3zm2-4.5h1.5v6H12zm6 1.5h-3v1.5h1.5V12H15v3h-1.5V9H18z"/></svg><span>GIFs</span></a>
        <a href="#tools" data-view="tools" role="tab"><svg viewBox="0 0 24 24"><path d="M21.7 18.6 13 9.9a5.5 5.5 0 0 0-7.1-7L9.5 6.5 6.5 9.5 2.9 5.9a5.5 5.5 0 0 0 7 7.1l8.7 8.7a1 1 0 0 0 1.4 0l1.7-1.7a1 1 0 0 0 0-1.4"/></svg><span>Tools</span></a>
        <a href="#cli" data-view="cli" role="tab"><svg viewBox="0 0 24 24"><path d="M3 4h18a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1m1 2v12h16V6zm2 2.5L7.4 7 12 11.5 7.4 16 6 14.5 9 11.5zM12 14h6v2h-6z"/></svg><span>Brain CLI</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="link-state" id="link-state" data-state="connecting"><i></i><span>connecting…</span></div>
        <div class="muted small" id="version"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">Overview</h1>
          <span class="server-chip" id="server-chip">—</span>
          <span class="demo-chip" id="demo-chip" hidden>DEMO DATA</span>
        </div>
        <div class="topbar-right">
          <div class="now-chip" id="now-chip" data-phase="idle"><i></i><span>idle</span></div>
          <div class="kv"><span class="muted">uptime</span> <b id="uptime">—</b></div>
          <div class="kv"><span class="muted">server</span> <b id="clock">—</b></div>
          <button class="alert-btn" id="alert-btn" title="Alerts" aria-label="Alerts"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8a2.5 2.5 0 0 0 2.4 2m7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg><i id="alert-count" hidden>0</i></button>
        </div>
      </header>

      <main id="views">
        <section class="view" id="view-overview" data-title="Overview"><div class="empty">Connecting to LatoDash…</div></section>
        <section class="view" id="view-logs" data-title="Logs" hidden></section>
        <section class="view" id="view-api" data-title="API calls" hidden></section>
        <section class="view" id="view-settings" data-title="Settings" hidden></section>
        <section class="view" id="view-gifs" data-title="GIFs" hidden></section>
        <section class="view" id="view-tools" data-title="Tools" hidden></section>
        <section class="view view-cli" id="view-cli" data-title="Brain CLI" hidden></section>
      </main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="modal" id="modal"></dialog>
  <div class="drawer" id="alert-drawer" hidden></div>
</body>
</html>
